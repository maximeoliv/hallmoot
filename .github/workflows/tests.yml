name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the suite
        # Peering and load tests start real servers on loopback, so they need
        # nothing but a free port — which is the point: what is tested here is
        # what runs in production, not a mock of it.
        run: python -m pytest
